name: Domain check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: check
        continue-on-error: true
        run: node scripts/check-domains.mjs --report report.md
      - name: Open or update the domain-check issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create domain-check --color D93F0B --description "Weekly domain check" --force
          number=$(gh issue list --label domain-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Domain check failed" --label domain-check --body-file report.md
          fi
          exit 1
